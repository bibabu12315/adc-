FUNC void displayvalues(void) {
  int idx;
  unsigned int v;

  exec("log > ADC_Raw_Data.log");
  // 注：代码中数组大小为 ADC_DATA_SIZE (40000)
  for (idx = 0; idx < 40000; idx++) {
    v = g_ADC_Raw_Data[idx];
    // 分为两组 printf，输出16个 bit，每4个数之间插入一个空格
    printf("%d%d%d%d %d%d%d%d ", 
           (v>>15)&1, (v>>14)&1, (v>>13)&1, (v>>12)&1,
           (v>>11)&1, (v>>10)&1, (v>>9)&1, (v>>8)&1);
    printf("%d%d%d%d %d%d%d%d\n", 
           (v>>7)&1, (v>>6)&1, (v>>5)&1, (v>>4)&1,
           (v>>3)&1, (v>>2)&1, (v>>1)&1, (v>>0)&1);
  }
  exec("log off");
}
